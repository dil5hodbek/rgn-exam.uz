services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-examflow}
      POSTGRES_USER: ${POSTGRES_USER:-examflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examflow}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    env_file:
      - path: .env.example
      - path: .env
        required: false
    volumes:
      - uploads:/data/uploads
      - ./resources/source-archive:/data/source-archive:ro
    ports:
      - "${BACKEND_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: ./backend
    command: celery -A app.worker.celery worker --loglevel=INFO
    env_file:
      - path: .env.example
      - path: .env
        required: false
    volumes:
      - uploads:/data/uploads
      - ./resources/source-archive:/data/source-archive:ro
    depends_on:
      - backend
      - redis

  bot:
    build: ./bot
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-13000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads:
