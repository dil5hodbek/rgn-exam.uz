name: examflow

# Production compose: unlike docker-compose.yml (dev), this requires a real
# .env file — no fallback to .env.example — so weak default secrets
# (JWT_SECRET, CSRF_SECRET, ADMIN_PASSWORD) can never accidentally run in
# production. app/core/config.py additionally refuses to start with those
# defaults when ENVIRONMENT=production, as a second line of defense.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-examflow}
      POSTGRES_USER: ${POSTGRES_USER:-examflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examflow}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - path: .env
        required: true
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build: ./bot
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    env_file:
      - path: .env
        required: true
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-13001}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads:
