name: CI & Deploy

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: examflow_test
          POSTGRES_USER: examflow
          POSTGRES_PASSWORD: examflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U examflow"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://examflow:examflow@localhost:5432/examflow_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        run: pytest backend/tests/
        working-directory: .

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  deploy:
    needs: [backend-test, frontend-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CI_DEPLOY_SSH_KEY }}
          SSH_HOSTNAME: ${{ secrets.SSH_HOSTNAME }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/ci_deploy_key
          chmod 600 ~/.ssh/ci_deploy_key
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName $SSH_HOSTNAME
            User registon
            IdentityFile ~/.ssh/ci_deploy_key
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Sync files to server
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude '.env.example' \
            --exclude 'node_modules' \
            --exclude '__pycache__' \
            --exclude '.next' \
            --exclude 'uploads' \
            --exclude 'docker-compose.override.yml' \
            --exclude 'docker-compose.yml' \
            --exclude 'Mid and End course yangi  testlar Road Map' \
            -e ssh \
            ./ deploy-target:~/examflow-copy/

      - name: Rebuild and restart
        run: ssh deploy-target "cd ~/examflow-copy && docker compose up -d --build"
